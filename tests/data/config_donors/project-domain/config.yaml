# PC-F semantic parity slice of the archived `kits/project-domain` config.
#
# DP-0C authorized copying "only semantic parity fixtures needed by PC-F/PC-G
# into test data" before deleting the kit bundles. The bundles were deleted in
# b36b2a1b; the full original is `kits/project-domain/config.yaml` at b36b2a1b^.
#
# This slice keeps exactly the entity/relationship vocabulary the PC-F parity
# cases traverse and quotes the two named queries verbatim from the archive. The
# overlay's other queries, ownership edges, governed judgment edges, milestones,
# and release lines are out of scope for query parity and are not reproduced.
#
# The archive shipped this as an OVERLAY over agent-operation, so `WorkItem` was
# supplied by the base. A parity fixture has to load standalone, so `WorkItem` is
# declared here with the base kit's shape (id + the properties the two ported
# queries read). Nothing else about the ported queries changed.
version: "1.0"
name: project_domain_parity_slice
description: >
  Project/product domain parity slice: product areas, capabilities, roadmap
  items, and the work-axis edges that connect them. Retained as the PC-F
  project-domain query-meaning oracle, not as runtime config.

enums:
  lifecycle_status: [planned, active, blocked, watching, deferred, closed]
  priority: {values: [low, medium, high, critical], ordered: low_to_high}
  work_item_type: [feature, bug, cleanup, research, docs, test, infrastructure, operations]

entity_types:
  ProductArea:
    description: Stable product, project, subsystem, package, or responsibility area.
    id: area_id
    properties:
      name: string indexed
      description: string?

  Capability:
    description: Durable technical or product ability the project supports.
    id: capability_id
    properties:
      name: string indexed
      description: string?
      status: enum lifecycle_status

  RoadmapItem:
    description: Planned investment, initiative, or roadmap-level change.
    id: roadmap_item_id
    properties:
      title: string indexed
      summary: string?
      status: enum lifecycle_status
      priority: enum priority
      target_date: date?

  WorkItem:
    description: Execution-level item an agent or human can work, review, close, defer, or supersede.
    id: work_item_id
    properties:
      title: string indexed
      summary: string?
      type: enum work_item_type
      status: enum lifecycle_status
      priority: enum priority

relationships:
  - work_item_implements_roadmap_item: WorkItem -> RoadmapItem  # Work item executes part of a roadmap item.
  - work_item_targets_area: WorkItem -> ProductArea  # Work item targets a product area.
  - roadmap_item_targets_area: RoadmapItem -> ProductArea  # Roadmap item targets a product area.
  - capability_in_area: Capability -> ProductArea  # Capability belongs to a product area.
  - roadmap_item_targets_capability: RoadmapItem -> Capability  # Roadmap item targets a capability.

named_queries:
  work_items_for_area:
    mode: traversal
    description: Flat work items attached to a product area for agents that need a scannable area work queue.
    entry_point: ProductArea
    returns: WorkItem
    result_shape: entity
    traverse:
      - relationship: work_item_targets_area
        direction: incoming
        as: work_item

  area_work_items:
    mode: traversal
    description: Work items reachable from a product area directly, through capabilities, or through roadmap items.
    entry_point: ProductArea
    returns: WorkItem
    result_shape: entity
    traverse:
      - relationship:
          - work_item_targets_area
          - roadmap_item_targets_area
          - capability_in_area
          - roadmap_item_targets_capability
          - work_item_implements_roadmap_item
        direction: incoming
        as: area_work
        max_depth: 3
        where:
          candidate.properties.status:
            not_in:
              - closed
    select:
      work_item_id: $result.entity_id
      title: $result.properties.title
      status: $result.properties.status
      priority: $result.properties.priority
      type: $result.properties.type

constraints: []
