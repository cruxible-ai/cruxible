# PC-F semantic parity slice of the archived `kits/supply-chain-blast-radius`
# config -- the one BUSINESS domain the PC-F parity fixtures draw from.
#
# DP-0C authorized copying "only semantic parity fixtures needed by PC-F/PC-G
# into test data" before deleting the kit bundles. The bundles were deleted in
# b36b2a1b; the full original is `kits/supply-chain-blast-radius/config.yaml` at
# b36b2a1b^ (2248 lines of ontology, providers, workflows, and gates).
#
# This slice keeps only the incident/supplier/work vocabulary the PC-F parity
# cases traverse. BOM structure, inventory, buffer assessments, shipments,
# providers, workflows, resolution contracts, and the governed cascade
# judgments are out of scope for query parity and are not reproduced.
#
# The archived `incident_impacts_supplier` edge is `write_policy: proposal_only`
# under a governed proposal policy. Parity fixtures seed state through direct
# writes, so this slice retains the edge WITHOUT its governance so the query
# meaning stays testable; nothing in the PC-F parity claim concerns write
# admission. The ported query bodies are otherwise verbatim.
version: "1.0"
name: supply_chain_blast_radius_parity_slice
description: >
  Supply-chain blast-radius parity slice: incidents, suppliers, and the response
  work attached to them. Retained as the PC-F business-domain query-meaning
  oracle, not as runtime config.

enums:
  lifecycle_status: [planned, active, blocked, watching, deferred, closed]
  priority: {values: [low, medium, high, critical], ordered: low_to_high}
  work_item_type: [feature, bug, cleanup, research, docs, test, infrastructure, operations]
  incident_severity: {values: [low, medium, high, critical], ordered: low_to_high}
  incident_scope_type: [supplier, geography]
  incident_status: [open, monitoring, closed]
  supplier_match_basis: [direct, geography]

entity_types:
  Supplier:
    description: External supplier of raw materials, parts, or assemblies.
    id: supplier_id
    properties:
      name: string indexed
      primary_geography: string

  Incident:
    description: Supplier-side disruption or geography-level supply event.
    id: incident_id
    properties:
      title: string indexed
      severity: enum incident_severity
      scope_type: enum incident_scope_type
      scope_id: string?
      status: enum incident_status
      reported_at: date
      closed_at: date?
      summary: string?

  WorkItem:
    description: Execution-level item an agent or human can work, review, close, defer, or supersede.
    id: work_item_id
    properties:
      title: string indexed
      summary: string?
      type: enum work_item_type
      status: enum lifecycle_status
      priority: enum priority

relationships:
  - work_item_addresses_incident: WorkItem -> Incident  # Work item responds to or mitigates an incident.
  - incident_impacts_supplier: Incident -> Supplier  # The incident materially impacts this supplier.
    properties:
      match_basis: "enum supplier_match_basis?"
      rationale: string

named_queries:
  incident_work_items:
    mode: traversal
    entry_point: Incident
    returns: WorkItem
    relationship_state: reviewable
    description: Open response work addressing this incident.
    traverse:
      - relationship: work_item_addresses_incident
        as: response_work
        where: {status: {not_in: [closed]}}
    select:
      properties: [work_item_id, title, status, priority, type]

  incident_impacted_suppliers:
    mode: traversal
    entry_point: Incident
    returns: Supplier
    relationship_state: reviewable
    description: Suppliers judged impacted by this incident, pending judgments visible.
    traverse:
      - relationship: incident_impacts_supplier
        as: impacted_supplier

  # Adapted from the archive's `open_incident_impacts`, which ordered impact
  # EDGES by `$from_entity.properties.severity` under `enum_ref:
  # incident_severity`. The parity slice keeps the same enum-ordinal ordering
  # rule on the entity collection so PC-F can measure the ordering semantics
  # without also reproducing the governed-edge review machinery.
  open_incidents_by_severity:
    mode: collection
    returns: Incident
    result_shape: entity
    description: Open incidents, most severe first -- the standing blast-radius work queue.
    where: {status: {eq: open}}
    select:
      incident_id: $result.entity_id
      title: $result.properties.title
      severity: $result.properties.severity
    order: severity desc ^incident_severity

constraints: []
