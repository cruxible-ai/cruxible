# KEV Triage Operations — Procedure Blueprint (CONFORMANCE SPIKE, NON-SHIPPING)
#
# Authored against RFC "Procedure Blueprints" v0.3 (2026-08-04) and the real
# kev-triage kit at kits/kev-triage/config.yaml (kit 0.2.8, core >= 0.2.8).
#
# This document is a FORMAT TEST, not an installable artifact. Every place where
# the RFC format and today's core/kit disagree is marked inline with one of:
#
#   [GAP-CORE]   core cannot do this today; friction-report.md ranks it
#   [GAP-FORMAT] the RFC underspecifies or mis-specifies this; I had to decide
#   [INVENTED]   a field not in RFC §3 that the kit forced me to add
#   [OK]         validated against real core behavior — the format works here
#
# Verified-against (read, not run):
#   src/cruxible_core/procedure/types.py            step kinds, budgets, tiers
#   src/cruxible_core/service/procedures.py:110     python-provider refusal
#   src/cruxible_core/service/procedures.py:720+    config+lock acceptance pins
#   src/cruxible_core/config/schema.py:1817-1830    provider runtime/procedure_access
#   src/cruxible_core/config/composer.py:494        strict additive keyed maps
#   src/cruxible_core/kits/state_refs.py:101-117    state-ref grammar
#   src/cruxible_core/query/engine.py:445-470       traversal entry param = PK

blueprint:
  id: kev-triage-ops
  version: 0.1.0
  publisher: cruxible-ai
  description: >-
    Agent-invoked KEV triage procedure library: blast-radius brief for one CVE,
    owner action queue, exposure rescoring, and stale-exposure sweep. Reads are
    governed named queries; scoring is swappable compute; every run is receipted.
  provenance:
    origin: hybrid            # kit flows are curated; procedure shapes agent-authored
    evidence: []              # [GAP-FORMAT] §3 says "receipt refs, eval refs" but
                              # gives no ref grammar. A spike has no receipts to
                              # cite, and an empty list is indistinguishable from
                              # "no provenance claimed". See friction #12.

# ─────────────────────────────────────────────────────────────────────────────
# CONTRACTS — blueprint-owned, fully qualified per §10.1
# ─────────────────────────────────────────────────────────────────────────────
# [OK] dotted keys are legal: config `contracts` is a plain dict, contract refs
#      are resolved by exact string against config.contracts | BUILTIN_CONTRACTS
#      (config/validator.py:81). Nothing validates the charset, so
#      `publisher.blueprint.Contract` composes fine.
#
# [GAP-CORE] Contract MATCHING at bind time is undefined. Core validates a
#      payload against a ContractSchema structurally at runtime, but "a provider
#      whose contracts match the slot" (§4.2) has no implementation. If the
#      installer matches contracts NOMINALLY, no first-party provider can ever
#      bind to a blueprint slot, because the blueprint owns
#      `cruxible-ai.kev-triage-ops.ExposureAssessmentInput` and the kit owns
#      `AssetExposureAssessmentInput` — same fields, different names, forever.
#      Ranked #2 in the friction report.

contracts:

  # --- scope inputs (procedure contract_in + query-slot param contracts) ---

  cruxible-ai.kev-triage-ops.CveScopeInput:
    description: One KEV CVE id, used as the traversal entry key for Vulnerability.
    fields:
      cve_id: {type: string}

  cruxible-ai.kev-triage-ops.OwnerScopeInput:
    description: One internal owner id, used as the traversal entry key for Owner.
    fields:
      owner_id: {type: string}

  # --- query-slot RESULT contracts -------------------------------------------
  # [GAP-CORE/§11.1] The runtime emits an ENVELOPE, not rows:
  #   {results, total_results, returned_results, limit, truncated,
  #    limit_truncated, path_truncated, truncation_reasons, result_shape,
  #    dedupe, relationship_state, policy_summary, receipt_id}
  # `results` is an opaque list. A contract can therefore only type the envelope,
  # and every path-shaped query slot in this blueprint ends up with the SAME
  # contract. That is the pilot's "passthrough-generic" failure mode reappearing
  # one level up: the slot interface carries no information about what a row is.
  # Ranked #1 in the friction report.

  cruxible-ai.kev-triage-ops.QueryEnvelope:
    description: >-
      Generic query-step envelope. Types the completeness metadata only; `results`
      is untyped because core has no per-row contract validation.
    fields:
      results: {type: json}
      total_results: {type: int, optional: true}
      returned_results: {type: int, optional: true}
      truncated: {type: bool, optional: true}
    allow_extra: true          # the runtime envelope carries ~10 more keys

  # Row contracts below are DOCUMENTATION ONLY — nothing in core enforces them.
  # [GAP-CORE] I kept them because dropping them makes the blueprint unreadable
  # and makes swapping a bound query unreviewable. Core needs a `row_contract`
  # on query slots that the query's `select:` projection is checked against.

  cruxible-ai.kev-triage-ops.BlastRadiusServiceRow:
    description: >-
      DOCUMENTATION ONLY (unenforced). One reachable business service behind a
      CVE, with the asset/product hop that produced it.
    fields:
      service_id: {type: string}
      service_name: {type: string}
      service_criticality: {type: string}
      asset_id: {type: string}
      hostname: {type: string}
      product_id: {type: string}
      posture_status: {type: string, optional: true}

  cruxible-ai.kev-triage-ops.OwnerQueueRow:
    description: >-
      DOCUMENTATION ONLY (unenforced). One approved, unclosed exposure on an
      owner's asset.
    fields:
      cve_id: {type: string}
      kev_due_date: {type: date, optional: true}
      asset_id: {type: string}
      hostname: {type: string}
      priority: {type: string}

  # --- compute-slot contracts -------------------------------------------------
  # Derived from what the kit's flows genuinely pass, NOT copied wholesale:
  # every field below is a real input of a real kit provider call in
  # kits/kev-triage/config.yaml. Types are `json` because the payloads are
  # graph-derived row sets; core has no row-element typing (see #1).

  cruxible-ai.kev-triage-ops.AffectedAssessmentInput:
    description: Joined asset-product x vulnerability-product edges for version applicability.
    fields:
      joined_product_edges: {type: json}

  cruxible-ai.kev-triage-ops.AffectedAssessmentResult:
    description: Per asset/CVE affected verdicts with rank and basis text.
    fields:
      items: {type: json}

  cruxible-ai.kev-triage-ops.ExposureAssessmentInput:
    description: >-
      Affected candidates joined to asset entities, plus active control bindings,
      classification/mitigation edges, and the caller-owned assessment policy.
    fields:
      affected_asset_context: {type: json}
      active_control_bindings: {type: json}
      vulnerability_classification_edges: {type: json, optional: true}
      control_mitigation_edges: {type: json, optional: true}
      assessment_policy: {type: json}

  cruxible-ai.kev-triage-ops.ExposureAssessmentResult:
    description: Per asset/CVE exposure judgments with tri-state verdicts and priority.
    fields:
      items: {type: json}

  cruxible-ai.kev-triage-ops.ReconciliationInput:
    description: Accepted exposure/remediation state plus current product-derived candidates.
    fields:
      accepted_exposure_edges: {type: json}
      affected_items: {type: json}
      asset_product_edges: {type: json}
      vulnerability_product_edges: {type: json}
      remediated_edges: {type: json}

  cruxible-ai.kev-triage-ops.ReconciliationResult:
    description: Closure candidates for accepted exposures no longer supported by evidence.
    fields:
      items: {type: json}

# ─────────────────────────────────────────────────────────────────────────────
# DEPENDENCIES
# ─────────────────────────────────────────────────────────────────────────────

dependencies:

  reference_states:
    # [GAP-CORE] §3 writes `{alias: kev-reference, version: ">=2026.30"}`.
    # kits/state_refs.py:101-117 parses ONLY `alias` or `alias@release`, with
    # both parts matched against [A-Za-z0-9._-]+ — `>=2026.30` fails on `>` `=`.
    # Ranges are §11.6 (M). Written below in the form that parses TODAY:
    - state_ref: kev-reference          # resolves to :latest (entry.latest_release)
      # A pin would be `kev-reference@2026-03-27`. Note the honesty problem:
      # bare alias tracks a MUTABLE tag, and there is no way to say
      # "any release >= X" — so a blueprint must choose between pinning one
      # immutable release (and going stale) or tracking latest (and being
      # unpinned). Neither is what §5 versioning assumes.

  # [INVENTED] §3 declares `entity_types` only. Every query slot and procedure
  # in this blueprint traverses RELATIONSHIPS and orders by ENUMS. Without these
  # two lists, `entity_type_dependencies_present` passes on an instance where
  # the blueprint cannot possibly run. Ranked #3.
  entity_types:
    - Vulnerability           # kev-reference
    - Product                 # kev-reference
    - Vendor                  # kev-reference
    - Asset                   # kev-triage kit
    - BusinessService
    - Owner
    - CompensatingControl
    - VulnerabilityClass
  relationship_types:         # [INVENTED]
    - vulnerability_affects_product
    - product_from_vendor
    - asset_runs_product
    - asset_vulnerability_posture
    - asset_remediated_vulnerability
    - asset_patch_exception_for
    - asset_owned_by
    - asset_has_control
    - asset_has_exception
    - asset_patch_window
    - service_depends_on_asset
    - vulnerability_classified_as
    - control_mitigates_class
  enums:                      # [INVENTED] order_by enum_ref targets
    - {name: criticality, ordered: low_to_high}

  # [INVENTED] §3 has no way to depend on a KIT. Asset/BusinessService/
  # TriageDecision and every governed relationship above come from the
  # kev-triage OVERLAY, not from the kev-reference published state. Declaring
  # only `reference_states` describes half this blueprint's substrate.
  kits:
    - {kit_id: kev-triage, min_version: 0.2.8}

# ─────────────────────────────────────────────────────────────────────────────
# QUERY SLOTS — read sockets
# ─────────────────────────────────────────────────────────────────────────────
# [GAP-FORMAT] §3 gives query slots a `default:` body that "installs as the named
# config query". It has no way to say "bind to a query this instance ALREADY
# has". The kev-triage kit already ships exactly these reads
# (exposed_services, owner_patch_queue, asset_vulnerability_postures_requiring_action).
# Composition is strictly additive and REFUSES redefinition
# (config/composer.py:494), so the blueprint cannot install a default under the
# kit's name — it must install a NEAR-DUPLICATE under a namespaced name that
# then drifts from the kit's own. Ranked #4.
#
# [INVENTED] `install_as:` — §3 implies the installed query name is the slot
# name, which forces publisher-qualified slot names into every procedure step.
# Splitting readable slot name from qualified installed name is the minimum fix.
#
# [GAP-FORMAT] §3 never says whether a procedure's `query:` names the SLOT or the
# INSTALLED QUERY. This document names slots and assumes lowering rewrites them.
#
# [OK] Underscores, not dots, in installed query names: contract refs are matched
#      as opaque strings, but query names flow into CLI/README/generated-view
#      surfaces I did not verify against dots. The inconsistency (dots for
#      contracts, underscores for queries) is itself a format finding.

query_slots:

  blast_radius_services:
    install_as: cruxible_ai__kev_triage_ops__blast_radius_services   # [INVENTED]
    description: >-
      Candidate reachability for one CVE: services standing behind assets that
      run the affected product. Reachability, not current exposure.
    param_contract: cruxible-ai.kev-triage-ops.CveScopeInput
    result_contract: cruxible-ai.kev-triage-ops.QueryEnvelope
    row_contract: cruxible-ai.kev-triage-ops.BlastRadiusServiceRow   # [INVENTED, unenforced]
    default:
      # [OK] Real, verified query grammar: `explicit: true` opts into the engine
      # schema (config/compact.py:945). §3's example default used compact keys
      # with BARE SCALAR predicates (`where: {status: active}`); both the compact
      # and explicit shapes require operator maps (`{eq: active}`), and compact
      # `where` expands field names to `result.properties.<field>` which is only
      # valid for COLLECTION queries. §3's example does not load. See friction #7.
      explicit: true
      mode: traversal
      entry_point: Vulnerability      # [OK] params must carry the entry PK: cve_id
      returns: BusinessService
      result_shape: path
      dedupe: path
      relationship_state: reviewable
      max_paths: 2000
      max_paths_per_result: 20
      traversal:
        - {as: affected_product, relationship: vulnerability_affects_product, direction: outgoing}
        - {as: installed_product, relationship: asset_runs_product, direction: incoming}
        - {as: service_dependency, relationship: service_depends_on_asset, direction: incoming}
      include:
        owners:
          from: $path.installed_product.source
          relationship: asset_owned_by
          direction: outgoing
          many: true
          limit: 5
        exposure:
          from: $path.installed_product.source
          relationship: asset_vulnerability_posture
          direction: outgoing
          many: true
          limit: 5
          where:
            target.entity_id: {eq: $entry.entity_id}
          order_by:
            - {by: $edge.properties.priority, direction: desc, enum_ref: criticality}
      order_by:
        - {by: $result.properties.criticality, direction: desc, enum_ref: criticality}
        - {by: $result.properties.name, direction: asc}

  owner_action_queue:
    install_as: cruxible_ai__kev_triage_ops__owner_action_queue
    description: >-
      Strict action queue: approved exposed posture on one owner's assets,
      excluding remediated pairs and scoped exceptions.
    param_contract: cruxible-ai.kev-triage-ops.OwnerScopeInput
    result_contract: cruxible-ai.kev-triage-ops.QueryEnvelope
    row_contract: cruxible-ai.kev-triage-ops.OwnerQueueRow            # [INVENTED, unenforced]
    default:
      explicit: true
      mode: traversal
      entry_point: Owner              # params must carry owner_id
      returns: Vulnerability
      result_shape: path
      dedupe: path
      max_paths: 1000
      max_paths_per_result: 20
      traversal:
        - {as: owned_asset, relationship: asset_owned_by, direction: incoming}
        - as: exposure
          relationship: asset_vulnerability_posture
          direction: outgoing
          where:
            edge.metadata.assertion.review.status: {eq: approved}
            edge.properties.status: {eq: exposed}
          exclude_if_related:
            - {relationship: asset_remediated_vulnerability, direction: outgoing}
            - {relationship: asset_patch_exception_for, direction: outgoing}
      include:
        patch_windows:
          from: $path.owned_asset.source
          relationship: asset_patch_window
          direction: outgoing
          many: true
          limit: 5
          order_by:
            - {by: $target.properties.next_window_at, direction: asc}
      order_by:
        - {by: $path.exposure.edge.properties.priority, direction: desc, enum_ref: criticality}
        - {by: $path.owned_asset.source.properties.hostname, direction: asc}

  open_posture_work:
    install_as: cruxible_ai__kev_triage_ops__open_posture_work
    description: Fleet-wide exposed posture edges needing attention (no scope param).
    param_contract: cruxible.EmptyInput     # [OK] builtin; not every slot needs a
                                            # blueprint-owned param type
    result_contract: cruxible-ai.kev-triage-ops.QueryEnvelope
    default:
      explicit: true
      mode: collection
      returns: asset_vulnerability_posture
      result_shape: relationship
      dedupe: none
      relationship_state: reviewable
      allow_relationship_state_override: true
      where:
        edge.properties.status: {eq: exposed}
      order_by:
        - {by: $relationship.properties.priority, direction: desc, enum_ref: criticality}
        - {by: $from_entity.properties.criticality, direction: desc, enum_ref: criticality}
        - {by: $to_entity.properties.kev_due_date, direction: asc, value_type: date}
        - {by: $from_entity.properties.hostname, direction: asc}
        - {by: $to_entity.entity_id, direction: asc}

# ─────────────────────────────────────────────────────────────────────────────
# COMPUTE SLOTS — swappable stages
# ─────────────────────────────────────────────────────────────────────────────
# [GAP-CORE, KNOWN] Every slot below is UNBINDABLE on today's kev-triage kit.
# The obstruction is worse than "procedures reject Python providers":
#
#   1. service/procedures.py:110 refuses any procedure referencing a provider
#      with runtime == "python".
#   2. config/schema.py:1827 refuses a config that even DECLARES
#      procedure_access on a python provider — so the kit cannot opt in without
#      re-hosting the provider behind http_json/command AND re-digesting the
#      lock (cruxible.lock.yaml pins provider_entrypoint_digest per provider).
#
# All four kev-triage providers are `runtime: python` with `kit://` refs. The
# blueprint is therefore correct-but-inert: the format models the slots fine,
# the substrate cannot fill them. Marked per slot below.
#
# [GAP-CORE] Slot indirection does not exist at all. ProcedureDefinition
# .referenced_providers() is validated against config.providers by NAME
# (service/procedures.py:98-104), and compile resolves the same names. There is
# no run-start binding-ledger lookup. §11's claim that compute-slot rebinds
# "bypass the config-pin problem entirely" is true only after the engine learns
# to resolve a slot name against state.db. Ranked #5.

slots:

  affected_assessment:
    description: >-
      Decide whether an installed version falls inside a reference-layer
      affected range. Deterministic, no model.
    contract_in: cruxible-ai.kev-triage-ops.AffectedAssessmentInput
    contract_out: cruxible-ai.kev-triage-ops.AffectedAssessmentResult
    billing: [platform, byok]
    capabilities: [deterministic, no_side_effects]   # [INVENTED] §2 promises
      # "capability tags" on slots; §3 never shows the field. The kit's real
      # providers carry deterministic/side_effects, and a reviewer accepting a
      # procedure needs those facts at the slot, not only on the binding.
    # UNBINDABLE TODAY: nearest candidate is kit provider `assess_asset_affected`
    # (runtime: python, ref kit://providers/assessment.py::assess_asset_affected).

  exposure_assessment:
    description: >-
      Score material exposure of an affected asset from internet exposure,
      environment, criticality, and active compensating controls.
    contract_in: cruxible-ai.kev-triage-ops.ExposureAssessmentInput
    contract_out: cruxible-ai.kev-triage-ops.ExposureAssessmentResult
    billing: [platform, byok]
    capabilities: [deterministic, no_side_effects]
    outcome_metric:
      # [GAP-FORMAT] §6 spells this as {contract: <resolution contract>, metric: brier}.
      # The kit's real scoring machinery is an OUTCOME PROFILE
      # (`asset_vulnerability_posture_resolution`, anchor_type: resolution,
      # outcome_codes overestimated_exposure / underestimated_exposure) — a named
      # config object, not a contract type, and its codes are categorical, so the
      # honest metric is precision/recall against resolution outcomes, not Brier.
      # Written the way the kit actually scores; flagged as a format mismatch.
      outcome_profile: asset_vulnerability_posture_resolution   # [INVENTED field]
      metric: precision_recall
    # UNBINDABLE TODAY: nearest candidate `assess_asset_exposure` (python).

  reconciliation_assessment:
    description: >-
      Compare accepted exposure edges against current product-derived candidates
      and identify stale exposures to close.
    contract_in: cruxible-ai.kev-triage-ops.ReconciliationInput
    contract_out: cruxible-ai.kev-triage-ops.ReconciliationResult
    billing: [platform]
    capabilities: [deterministic, no_side_effects]
    outcome_metric:
      outcome_profile: asset_remediated_resolution
      metric: precision_recall
    # UNBINDABLE TODAY: nearest candidate `assess_exposure_reconciliation` (python).

# ─────────────────────────────────────────────────────────────────────────────
# PROCEDURE LIBRARY — invocation: manual (the first executable slice, §11)
# ─────────────────────────────────────────────────────────────────────────────
invocation: manual

# Step kinds used below are EXACTLY the procedure top-level set from
# procedure/types.py:47-61 — query, provider, assert, assert_not_truncated,
# assert_count, assert_exists, shape_items, join_items, filter_items,
# aggregate_items, dedupe_items (+ repeat). No make_*/propose_*/apply_* appears
# anywhere: those are the governed output bridge (§11.2) and would be refused.
#
# [OK] Required-by-core fields §3's example omits and I had to add to every
#      procedure: `precondition` (no default on ProcedureDefinition) and
#      `contract_in` semantics. §9 says "budgets/tiers mandatory"; precondition
#      is equally mandatory and unmentioned.
#
# [GAP-FORMAT] Provider step outputs are the provider's contract_out payload
#      DIRECTLY (`$steps.matches.items` in the real kit). §3's pipelines still
#      write `$steps.text.result` / `$steps.batch.result` — a `.result` wrapper
#      that does not exist. Query steps use `.results`. Two of the four refs in
#      §3's example pipelines would fail at execution.

procedures:

  # ── 1. Blast-radius brief for one CVE ────────────────────────────────────
  - name: kev_blast_radius_brief
    description: >-
      What does this CVE actually put at risk? Returns the reachable business
      services with the asset/product hop that produced each row, plus a
      receipted count. Reachability, not current exposure.
    contract_in: cruxible-ai.kev-triage-ops.CveScopeInput
    contract_out: cruxible-ai.kev-triage-ops.QueryEnvelope
    declared_tier: governed_write   # [GAP-FORMAT] this procedure writes NOTHING.
      # ProcedureTier is Literal["governed_write","graph_write","admin"] — there
      # is no read-only tier, so a pure read library advertises write authority.
    precondition: {}                # required by core; unmentioned in §3
    budget: {wall_clock_s: 45, max_provider_calls: 0}
    steps:
      - id: services
        query: blast_radius_services          # SLOT name (lowering rewrites)
        params: {cve_id: $input.cve_id}       # [OK] `params:`, not `input:` —
                                              # confirmed config/schema.py:2414
        as: services
      - id: require_complete_blast_radius
        assert_not_truncated: {step: services}
      - id: brief
        aggregate_items:
          items: $steps.services.results      # [OK] `.results` envelope key
          measures:
            service_count: {count: true}
        as: brief
    returns: services                          # names a produced alias (§9 #2)
    evidence_outputs: [brief]                  # [INVENTED at format level] §3 never
      # mentions evidence_outputs, but it is how a procedure's intermediate
      # output becomes a receipted, digest-addressed artifact. A blueprint that
      # cannot declare it ships procedures whose evidence trail is thinner than
      # a hand-written one.

  # ── 2. Owner action queue ────────────────────────────────────────────────
  - name: kev_owner_action_queue
    description: >-
      The strict work queue for one owner: approved exposed posture on their
      assets, closed and exception-covered pairs already excluded, ordered by
      priority then hostname.
    contract_in: cruxible-ai.kev-triage-ops.OwnerScopeInput
    contract_out: cruxible-ai.kev-triage-ops.QueryEnvelope
    declared_tier: governed_write
    precondition: {}
    budget: {wall_clock_s: 45, max_provider_calls: 0}
    steps:
      - id: queue
        query: owner_action_queue
        params: {owner_id: $input.owner_id}
        as: queue
      - id: require_complete_queue
        assert_not_truncated: {step: queue}
      - id: queue_summary
        aggregate_items:
          items: $steps.queue.results
          measures:
            open_items: {count: true}
        as: queue_summary
    returns: queue
    evidence_outputs: [queue_summary]

  # ── 3. Exposure rescore (the read+assess half of propose_asset_exposure) ──
  - name: kev_exposure_rescore
    description: >-
      Recompute asset-vulnerability exposure candidates from accepted product
      mappings and current reference edges. Returns scored candidates for review.
      It DOES NOT WRITE — see the governed-output-bridge note below.
    contract_in: cruxible.EmptyInput
    contract_out: cruxible-ai.kev-triage-ops.ExposureAssessmentResult
    declared_tier: governed_write
    precondition: {}
    budget: {wall_clock_s: 300, max_provider_calls: 2}
    #
    # [GAP-CORE, THE BIG ONE] The kit's real flow continues:
    #     make_candidates -> map_signals x3 -> propose_relationship_group
    # None of those kinds are legal in a procedure (procedure/types.py:47-61),
    # and provider output does not auto-convert to pending writes. So the
    # blueprint's "governed pending writes out" exit is amputated: this procedure
    # can only HAND SCORED ROWS BACK TO THE AGENT, which must then run the kit
    # workflow `propose_asset_exposure` to actually propose. Two executions, two
    # receipts, and the assessment the reviewer sees is not provably the one the
    # procedure produced. Ranked #6.
    #
    # [GAP-FORMAT] §3 says reads come from query slots. Seven of the reads below
    # are internal plumbing (enumerate accepted edges to join) with no plausible
    # customization value. Declaring seven more query slots would triple the
    # blueprint's surface for zero customer benefit, so they are inline
    # collection queries — exactly what the kit does. The format needs to say
    # inline reads are legal and slots are for customization points. Ranked #8.
    steps:
      - id: asset_products
        query: {mode: collection, result_shape: relationship, returns: asset_runs_product, relationship_state: accepted}
        as: asset_products
      - id: require_complete_asset_products
        assert_not_truncated: {step: asset_products}
      - id: require_asset_products
        assert_count:
          step: asset_products
          count: returned_results
          op: gt
          value: 0
          message: Exposure rescore requires accepted asset-product mappings.
      - id: vulnerability_products
        query: {mode: collection, result_shape: relationship, returns: vulnerability_affects_product}
        as: vulnerability_products
      - id: require_complete_vulnerability_products
        assert_not_truncated: {step: vulnerability_products}
      - id: affected_product_join
        join_items:
          left_items: $steps.asset_products.results
          right_items: $steps.vulnerability_products.results
          left_key: $item.to_id
          right_key: $item.to_id
          fields:
            product_id: $item.join_key
            asset_product_edge: $item.left
            vulnerability_product_edge: $item.right
        as: affected_product_join
      - id: affected_assessments
        provider: affected_assessment            # SLOT name
        input:
          joined_product_edges: $steps.affected_product_join.items
        as: affected_assessments
      - id: affected_candidates
        dedupe_items:
          items: $steps.affected_assessments.items   # provider output, no `.result`
          keys: [$item.asset_id, $item.cve_id]
          strategy: max
          rank: $item.verdict_rank
        as: affected_candidates
      - id: assets
        query: {mode: collection, result_shape: entity, returns: Asset}
        as: assets
      - id: require_complete_assets
        assert_not_truncated: {step: assets}
      - id: affected_asset_context
        join_items:
          left_items: $steps.affected_candidates.items
          right_items: $steps.assets.results
          left_key: $item.asset_id
          right_key: $item.entity_id
          fields:
            affected_item: $item.left
            asset_entity: $item.right
        as: affected_asset_context
      - id: asset_controls
        query: {mode: collection, result_shape: relationship, returns: asset_has_control}
        as: asset_controls
      - id: controls
        query: {mode: collection, result_shape: entity, returns: CompensatingControl}
        as: controls
      - id: asset_control_bindings
        join_items:
          left_items: $steps.asset_controls.results
          right_items: $steps.controls.results
          left_key: $item.to_id
          right_key: $item.entity_id
          fields:
            asset_id: $item.left.from_id
            control_id: $item.left.to_id
            asset_control_edge: $item.left
            control_entity: $item.right
        as: asset_control_bindings
      - id: active_control_bindings
        filter_items:
          items: $steps.asset_control_bindings.items
          comparisons:
            - {left: $item.control_entity.properties.status, op: eq, right: active}
        as: active_control_bindings
      - id: vulnerability_classifications
        query: {mode: collection, result_shape: relationship, returns: vulnerability_classified_as, relationship_state: accepted}
        as: vulnerability_classifications
      - id: control_mitigations
        query: {mode: collection, result_shape: relationship, returns: control_mitigates_class}
        as: control_mitigations
      - id: assessments
        provider: exposure_assessment            # SLOT name
        input:
          affected_asset_context: $steps.affected_asset_context.items
          active_control_bindings: $steps.active_control_bindings.items
          vulnerability_classification_edges: $steps.vulnerability_classifications.results
          control_mitigation_edges: $steps.control_mitigations.results
          # [GAP-FORMAT] This policy literal is real kit configuration inlined
          # into a step. In the kit it lives in the workflow body and is owned by
          # the operator. In a blueprint it becomes publisher-frozen, because the
          # blueprint digest covers procedure bodies and nothing else is editable
          # except query-slot bodies. A blueprint needs a `parameters:` block
          # (install-time, receipted, digest-excluded like billing per §10.3).
          # Ranked #9.
          assessment_policy:
            exploitability:
              direct_exposure_verdict: support
              reviewable_environments: [production]
              reviewable_environment_verdict: unsure
              default_verdict: contradict
            priority:
              elevated_exploitability_verdict: support
              elevated_control_verdict: support
              elevated_priority_by_criticality: {critical: critical, default: high}
              high_priority_criticalities: [critical, high]
              high_priority: high
              default_priority: medium
              mitigated_priority_by_current_priority: {critical: medium, high: medium, medium: low, low: low}
              reducing_control_effects: [reduces]
              priority_order: [low, medium, high, critical]
            control_effects:
              rank: [blocks, compensates, reduces, detects]
              mitigating: [blocks, compensates]
        as: assessments
      - id: exposure_summary
        aggregate_items:
          items: $steps.assessments.items
          group_by: {priority: $item.priority}
          measures:
            exposure_count: {count: true}
            affected_assets: {count_distinct: {value: $item.asset_id}}
            vulnerabilities: {count_distinct: {value: $item.cve_id}}
        as: exposure_summary
    returns: assessments
    evidence_outputs: [exposure_summary]
    # static expansion: 19 steps, 2 provider calls — inside the 100/500/250 caps
    # and consistent with budget.max_provider_calls (types.py:237 refuses
    # a budget below the expanded count). [OK] the ceilings never bit.

  # ── 4. Stale-exposure sweep ──────────────────────────────────────────────
  - name: kev_stale_exposure_sweep
    description: >-
      After a KEV reference refresh or product-mapping change, find accepted
      exposure edges no longer supported by current product-derived evidence.
      Returns closure candidates for review; it does not close anything.
    contract_in: cruxible.EmptyInput
    contract_out: cruxible-ai.kev-triage-ops.ReconciliationResult
    declared_tier: governed_write
    precondition: {}
    budget: {wall_clock_s: 300, max_provider_calls: 2}
    steps:
      - id: asset_products
        query: {mode: collection, result_shape: relationship, returns: asset_runs_product, relationship_state: accepted}
        as: asset_products
      - id: require_complete_asset_products
        assert_not_truncated: {step: asset_products}
      - id: vulnerability_products
        query: {mode: collection, result_shape: relationship, returns: vulnerability_affects_product}
        as: vulnerability_products
      - id: require_complete_vulnerability_products
        assert_not_truncated: {step: vulnerability_products}
      - id: reconciliation_product_join
        join_items:
          left_items: $steps.asset_products.results
          right_items: $steps.vulnerability_products.results
          left_key: $item.to_id
          right_key: $item.to_id
          fields:
            product_id: $item.join_key
            asset_product_edge: $item.left
            vulnerability_product_edge: $item.right
        as: reconciliation_product_join
      - id: affected_assessments
        provider: affected_assessment
        input:
          joined_product_edges: $steps.reconciliation_product_join.items
        as: affected_assessments
      - id: affected_candidates
        dedupe_items:
          items: $steps.affected_assessments.items
          keys: [$item.asset_id, $item.cve_id]
          strategy: max
          rank: $item.verdict_rank
        as: affected_candidates
      - id: accepted_exposures
        query: {mode: collection, result_shape: relationship, returns: asset_vulnerability_posture, relationship_state: accepted}
        as: accepted_exposures
      - id: require_complete_accepted_exposures
        assert_not_truncated: {step: accepted_exposures}
      - id: remediated_edges
        query: {mode: collection, result_shape: relationship, returns: asset_remediated_vulnerability, relationship_state: accepted}
        as: remediated_edges
      - id: require_complete_remediated_edges
        assert_not_truncated: {step: remediated_edges}
      - id: reconciliation
        provider: reconciliation_assessment
        input:
          accepted_exposure_edges: $steps.accepted_exposures.results
          affected_items: $steps.affected_candidates.items
          asset_product_edges: $steps.asset_products.results
          vulnerability_product_edges: $steps.vulnerability_products.results
          remediated_edges: $steps.remediated_edges.results
        as: reconciliation
      - id: reconciliation_summary
        aggregate_items:
          items: $steps.reconciliation.items
          group_by: {remediation_type: $item.remediation_type}
          measures:
            closure_count: {count: true}
            affected_assets: {count_distinct: {value: $item.asset_id}}
            vulnerabilities: {count_distinct: {value: $item.cve_id}}
        as: reconciliation_summary
    returns: reconciliation
    evidence_outputs: [reconciliation_summary]

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGERS / PIPELINES — deliberately ABSENT
# ─────────────────────────────────────────────────────────────────────────────
# One genuinely trigger-shaped flow exists in this kit: `propose_exposure_
# reconciliation` is documented as running "after a KEV reference refresh or
# product-mapping refresh", and the kev-triage skill describes a daily pass
# anchored on `cruxible state status` / `pull-preview`. That is a real
# schedule-or-event trigger with real demand.
#
# It is NOT written here, for two independent reasons:
#   1. No trigger surface exists anywhere in config or runtime (§11.4, from zero).
#   2. The pipeline's payload is a governed proposal, which procedures cannot
#      emit (§11.2). A trigger firing a read-only rescore would notify nobody
#      and write nothing.
# Inventing a `pipelines:` section here would have tested nothing.

# ─────────────────────────────────────────────────────────────────────────────
install_checks:
  - contracts_load
  - all_required_slots_bindable        # WOULD FAIL TODAY on all three compute slots
  - entity_type_dependencies_present
  - relationship_type_dependencies_present   # [INVENTED]
  - procedures_compile                 # returns-validation still unmerged (§11.5)
  # [INVENTED] Missing from §3 and non-optional in practice: applying this
  # blueprint's overlay CHANGES THE INSTANCE CONFIG DIGEST, and every already-
  # accepted procedure on the instance is pinned to the config+lock digest it was
  # accepted against (service/procedures.py:720-780, fail-closed on mismatch AND
  # on a missing pin). Installing any blueprint therefore BREAKS EVERY EXISTING
  # PROCEDURE on that instance until each is re-proposed and re-accepted by an
  # independent reviewer. Ranked #1-with-#0-severity in the friction report.
  - existing_procedures_repin_plan
