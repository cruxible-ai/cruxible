# docs.cruxible.ai — built from this repo's docs/ at the documented
# commit, so the site mirrors the repo by construction.
# Local preview:  uvx --with mkdocs-material mkdocs serve
# Build:          uvx --with mkdocs-material mkdocs build

site_name: Cruxible Docs
site_url: https://docs.cruxible.ai
site_description: >-
  Documentation for the Cruxible Playbill development core: governed semantic
  state, exact provenance, signed review, and reproducible accepted generations.
repo_url: https://github.com/cruxible-ai/cruxible
repo_name: cruxible-ai/cruxible
edit_uri: edit/main/docs/

docs_dir: docs
exclude_docs: |
  dev/

theme:
  name: material
  logo: assets/cruxible-mark-white.svg
  favicon: assets/favicon.png
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Roboto Flex
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - assets/brand.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cruxible-ai/cruxible
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/cruxible/
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - Concepts: concepts.md
      - Architecture: architecture.md
      - Modeling state: modeling-state.md
      - For AI agents: for-ai-agents.md
      - Family 1 Documents: playbill-family-1.md
  - Reference:
      - CLI reference: cli-reference.md
      - MCP tools: mcp-tools.md
      - DP-0 review guide: dp0-review-guide.md
  - Operations:
      - Auth and agent roles: runtime-auth-and-agent-roles.md
      - Isolated deployment: isolated-deployment.md
      - Procedure graph format: migrations/graph-definition-format.md
      - Hosted runtime image: hosted-runtime-image.md
