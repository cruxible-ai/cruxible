name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Tag, package version, client version, and the core dependency pin on
      # the client must agree before anything publishes. The check lives in a script (stdlib
      # only, so it runs on this bare checkout) rather than inline here, because
      # scripts/ci_parity.sh runs the same script pre-push: 0.3.1 tagged with
      # the client still at 0.3.0 and only this gate caught it.
      - name: Verify package versions are locked
        run: python scripts/check_version_lockstep.py --tag "$GITHUB_REF_NAME"

  # PyPI pending publishers must have distinct configurations, so the two
  # packages publish from separate jobs: cruxible-client under the
  # pypi-cruxible-client environment, cruxible with no environment.
  publish-client:
    runs-on: ubuntu-latest
    needs: verify-versions
    environment: pypi-cruxible-client
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Build cruxible-client
        run: uv build --package cruxible-client

      # The exact files PyPI receives, for the SBOM job below.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-cruxible-client
          path: dist/
          if-no-files-found: error

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 attestations through trusted publishing; stated, not left
          # to the action's default.
          attestations: true

  publish-cruxible:
    runs-on: ubuntu-latest
    needs: publish-client
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Build cruxible
        run: uv build --package cruxible

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-cruxible
          path: dist/
          if-no-files-found: error

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  # One CycloneDX SBOM per published wheel, attached to the GitHub release for
  # the tag (created here if it does not exist yet). Syft, as the providers
  # repository uses for its per-package SBOMs, scans a directory holding the
  # unpacked wheel (its own metadata) and the locked dependency closure that
  # wheel resolves to, exported from uv.lock.
  sbom:
    runs-on: ubuntu-latest
    needs: [publish-client, publish-cruxible]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Produce one SBOM per wheel
        run: |
          set -euo pipefail
          mkdir -p sbom
          for package in cruxible-client cruxible; do
            wheel_prefix="${package//-/_}-"
            wheel="$(ls dist/"$wheel_prefix"*.whl)"
            work="sbom-input/$package"
            mkdir -p "$work"
            python -m zipfile -e "$wheel" "$work/wheel"
            # The export leaves out workspace members, so cruxible's SBOM gets
            # the cruxible-client wheel it depends on unpacked beside its own.
            if [ "$package" = cruxible ]; then
              python -m zipfile -e "$(ls dist/cruxible_client-*.whl)" "$work/cruxible-client-wheel"
            fi
            uv export --frozen --no-dev --no-emit-workspace --no-hashes --no-header \
              --no-annotate --package "$package" -o "$work/requirements.txt"
            syft scan "dir:$work" -o cyclonedx-json="sbom/$(basename "$wheel" .whl).cdx.json"
          done
          ls -l sbom

      - name: Attach the SBOMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "See CHANGELOG.md for this release."
          fi
          gh release upload "$GITHUB_REF_NAME" sbom/*.cdx.json --clobber
