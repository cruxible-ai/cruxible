name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Tag, package version, client version, and the core dependency pin on
      # the client must agree before anything publishes. The check lives in a script (stdlib
      # only, so it runs on this bare checkout) rather than inline here, because
      # scripts/ci_parity.sh runs the same script pre-push: 0.3.1 tagged with
      # the client still at 0.3.0 and only this gate caught it.
      - name: Verify package versions are locked
        run: python scripts/check_version_lockstep.py --tag "$GITHUB_REF_NAME"

  # PyPI pending publishers must have distinct configurations, so the two
  # packages publish from separate jobs: cruxible-client under the
  # pypi-cruxible-client environment, cruxible with no environment.
  publish-client:
    runs-on: ubuntu-latest
    needs: verify-versions
    environment: pypi-cruxible-client
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Build cruxible-client
        run: uv build --package cruxible-client

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-cruxible:
    runs-on: ubuntu-latest
    needs: publish-client
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Build cruxible
        run: uv build --package cruxible

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
