name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # The commit the workspace.file seed manifest pins
  # (WORKSPACE_FILE_SEED_MANIFEST.provider_commit). The adapter checkout must be
  # at exactly this commit and clean, or the seeding tests skip instead of
  # reproducing the real local materialization.
  CRUXIBLE_PROVIDERS_COMMIT: aed9c1735e915adfeaa0d3d201942609bb7a8eae

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      CRUXIBLE_PROVIDERS_CHECKOUT: ${{ github.workspace }}/cruxible-providers

    steps:
      - uses: actions/checkout@v4

      # cruxible-providers is public, so this is an ordinary second checkout and
      # needs no credential. Without it the five seeding tests skip and the
      # local materialization law is never exercised in CI.
      - uses: actions/checkout@v4
        with:
          repository: cruxible-ai/cruxible-providers
          ref: ${{ env.CRUXIBLE_PROVIDERS_COMMIT }}
          path: cruxible-providers

      - uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Lint
        run: uv run ruff check src packages/cruxible-client/src tests

      - name: Format check
        run: uv run ruff format --check src packages/cruxible-client/src tests

      - name: Type check
        run: uv run mypy src packages/cruxible-client/src

      - name: Test
        run: uv run pytest --tb=short

  docker-image-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Verify Docker daemon
        run: docker info

      - name: Test Docker image
        env:
          CRUXIBLE_RUN_DOCKER_TESTS: "1"
        run: uv run pytest tests/test_image -m docker --tb=short

  wheel-install-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Build and verify installed wheel console scripts
        env:
          CRUXIBLE_RUN_WHEEL_TESTS: "1"
        run: uv run pytest tests/test_packaging -m wheel --tb=short
