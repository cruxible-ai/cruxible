name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # The cruxible-providers commit the provider-runtime tests run against
  # (tests/support/provider_checkout.py): the runtime is installed from it and
  # the provider wheels the installation tests transfer are built from it.
  CRUXIBLE_PROVIDERS_COMMIT: db085204aa66a0d23ae347ab808e7bbd5e6dc99e

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      CRUXIBLE_PROVIDERS_CHECKOUT: ${{ github.workspace }}/cruxible-providers

    steps:
      - uses: actions/checkout@v4

      # cruxible-providers is public, so this is an ordinary second checkout and
      # needs no credential. Without it the provider-runtime tests skip.
      - uses: actions/checkout@v4
        with:
          repository: cruxible-ai/cruxible-providers
          ref: ${{ env.CRUXIBLE_PROVIDERS_COMMIT }}
          path: cruxible-providers

      - uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      # Not a declared dependency: the daemon's operator installs the provider
      # toolchain beside it. uv run keeps it (its sync is not exact).
      - name: Install the provider runtime from the providers checkout
        run: uv pip install "$CRUXIBLE_PROVIDERS_CHECKOUT/packages/cruxible-provider-runtime"

      - name: Lint
        run: uv run ruff check src packages/cruxible-client/src tests

      - name: Format check
        run: uv run ruff format --check src packages/cruxible-client/src tests

      - name: Type check
        run: uv run mypy src packages/cruxible-client/src

      - name: Test
        run: uv run pytest -n auto --dist loadfile --tb=short

  docker-image-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Verify Docker daemon
        run: docker info

      - name: Test Docker image
        env:
          CRUXIBLE_RUN_DOCKER_TESTS: "1"
        run: uv run pytest tests/test_image -m docker --tb=short

  wheel-install-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Build and verify installed wheel console scripts
        env:
          CRUXIBLE_RUN_WHEEL_TESTS: "1"
        run: uv run pytest tests/test_packaging -m wheel --tb=short
