[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cruxible"
version = "0.5.1"
description = "Governed state for AI agents: deterministic proposals, signed approvals, provenance, and reproducible accepted generations."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "Cruxible LLC"},
]
keywords = ["ai-agents", "hard-state", "state-management", "ontology", "knowledge-as-code", "governance", "provenance", "mcp", "workflows", "deterministic", "receipts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "cruxible-client==0.5.1",
    # pydantic 2.14 changes the served OpenAPI (input/output component splitting); v1 serves one ratified surface.
    "pydantic>=2.12,<2.14",
    "packaging>=23.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "click>=8.0",
    # Security floor: 48.0.1 fixes CVE-2026-34073, -39892 and the bundled-OpenSSL
    # GHSA-537c-gmf6-5ccf. 49/50 fix only PKCS#7 and X.509-verification issues
    # (CVE-2026-69247/-69248/-69249) that Cruxible never reaches (it uses Ed25519
    # and key serialization), and 49 dropped x86_64 macOS wheels; the floor stays
    # at 48.0.1 so Intel Macs install a wheel. uv.lock pins 50.0.0.
    "cryptography>=48.0.1",
    "httpx>=0.24",
    # 0.133.0 is the first FastAPI release that supports Starlette 1.x.
    "fastapi>=0.133.0",
    # Transitive (fastapi, mcp) floors so a PyPI install cannot resolve a
    # vulnerable release. starlette 1.3.1 fixes CVE-2026-48710 (KEV-listed),
    # -54282, -54283, -48817, -48818.
    "starlette>=1.3.1",
    # python-multipart 0.0.31 fixes CVE-2026-40347, -42561, -53537..-53540.
    "python-multipart>=0.0.31",
    # PyJWT (via mcp) 2.15.0 fixes CVE-2026-32597, -48522..-48526, -101917,
    # -101918, -102267..-102275, -103001.
    "pyjwt>=2.15.0",
    "uvicorn[standard]>=0.20",
    # The MCP server (`cruxible mcp`, `cruxible-mcp`) ships in the base install,
    # so `uvx cruxible mcp` works without an extra. <2: mcp 2.0.0 removed the
    # bundled mcp.server.fastmcp the tools are built on; the SDK-2.0 migration
    # is tracked separately (wi-mcp-sdk-2-migration).
    # >=1.28.1: 1.27.2 fixes CVE-2026-52869 (session/principal binding) and
    # -52870 (experimental task scoping); 1.28.1 fixes CVE-2026-59950 (WebSocket
    # Host/Origin validation).
    "mcp>=1.28.1,<2",
    # Provider installs materialize environments with the provider runtime toolchain
    # (providers/package_materialization.py imports it); core never runs provider code.
    "cruxible-provider-runtime>=0.2.0",
    # The provider runtime materializes environments with uv (`uv pip sync`, `uv
    # build`); the PyPI package ships the binary beside the interpreter, so a pip
    # install and the runtime image both have it (providers/package_materialization.py
    # uv_executable).
    "uv>=0.8",
]

[project.optional-dependencies]
# There are deliberately no `server` or `mcp` extras: the daemon and the MCP
# server are base dependencies and ship in the default install.
dev = [
    "pytest>=9.0.3",  # CVE-2025-71176 (tmpdir handling)
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",  # CI fails a hung test with its stack instead of hanging the job
    "ruff==0.15.0",
    "mypy>=1.10",
]

[project.scripts]
cruxible = "cruxible_core.cli.main:cli"
cruxible-mcp = "cruxible_core.mcp.server:main"
# The daemon launches only via `cruxible server start`; there is no separate
# `cruxible-server` console-script (removed in wi-server-cli-verb-consistency).

[project.urls]
Homepage = "https://github.com/cruxible-ai/cruxible"
Documentation = "https://github.com/cruxible-ai/cruxible/tree/main/docs"
Repository = "https://github.com/cruxible-ai/cruxible"

[tool.hatch.build.targets.wheel]
packages = ["src/cruxible_core"]

[tool.uv.workspace]
members = ["packages/cruxible-client"]

[tool.uv.sources]
cruxible-client = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "packages/cruxible-client/src"]
markers = [
    "docker: requires a working Docker daemon and may build or run container images",
    "state_root_fallback: tests default state resolution against an isolated temporary HOME",
    "wheel: builds and installs the distribution wheel into a throwaway venv; requires build tooling",
    "taubench: drives the committed TauBench recipe (benchmarks/playbill_taubench) end to end; runs by default",
]

[tool.ruff]
src = ["src", "packages/cruxible-client/src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src:packages/cruxible-client/src"
packages = ["cruxible_core", "cruxible_client"]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20250915",
]
