[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cruxible"
version = "0.5.1"
description = "Governed state for AI agents: deterministic proposals, signed approvals, provenance, and reproducible accepted generations."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "Cruxible LLC"},
]
keywords = ["ai-agents", "hard-state", "state-management", "ontology", "knowledge-as-code", "governance", "provenance", "mcp", "workflows", "deterministic", "receipts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "cruxible-client==0.5.1",
    "pydantic>=2.12",
    "packaging>=23.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "click>=8.0",
    "cryptography>=46.0",
    "httpx>=0.24",
    "fastapi>=0.100",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.20",
]

[project.optional-dependencies]
# <2: mcp 2.0.0 removed the bundled mcp.server.fastmcp the tools are built
# on; the SDK-2.0 migration is tracked separately (wi-mcp-sdk-2-migration).
mcp = ["mcp>=1.0,<2"]
# There is deliberately no `server` extra: fastapi/uvicorn are base
# dependencies, so the daemon ships in the default install. Whether that stack
# should move back out of base deps is a 0.4 packaging question, not something
# an empty extra can express.
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff==0.15.0",
    "mypy>=1.10",
]

[project.scripts]
cruxible = "cruxible_core.cli.main:cli"
cruxible-mcp = "cruxible_core.mcp.server:main"
# The daemon launches only via `cruxible server start`; there is no separate
# `cruxible-server` console-script (removed in wi-server-cli-verb-consistency).

[project.urls]
Homepage = "https://github.com/cruxible-ai/cruxible"
Documentation = "https://github.com/cruxible-ai/cruxible/tree/main/docs"
Repository = "https://github.com/cruxible-ai/cruxible"

[tool.hatch.build.targets.wheel]
packages = ["src/cruxible_core"]

[tool.uv.workspace]
members = ["packages/cruxible-client"]

[tool.uv.sources]
cruxible-client = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "packages/cruxible-client/src"]
markers = [
    "docker: requires a working Docker daemon and may build or run container images",
    "state_root_fallback: tests default state resolution against an isolated temporary HOME",
    "wheel: builds and installs the distribution wheel into a throwaway venv; requires build tooling",
    "taubench: drives the committed benchmarks/playbill_taubench recipe end to end; runs by default",
]

[tool.ruff]
src = ["src", "packages/cruxible-client/src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src:packages/cruxible-client/src"
packages = ["cruxible_core", "cruxible_client"]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20250915",
]
